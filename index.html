đoàn Pol Pot – Ieng Sary tiến hành các hành động xâm phạm biên giới Tây Nam nước ta sau mốc nào?", "options": {"A": "Tháng 4 năm 1985", "B": "Tháng 4 năm 1995", "C": "Tháng 4 năm 2005", "D": "Tháng 4 năm 1975"}, "answer": "D", "level": "Nhận biết", "page": 5, "reference": "I.1. Bối cảnh và những nét chính của cuộc chiến tranh"}, {"id": 2, "grade": 12, "lesson": 1, "question": "Theo SGK, ngày 23/12/1978, Trung ương Đảng Cộng sản Campuchia ra lời kêu gọi về việc gì?", "options": {"A": "Tổ chức bầu cử tại Việt Nam", "B": "Đoàn kết đấu tranh lật đổ chế độ diệt chủng Pol Pot – Ieng Sary", "C": "Tổ chức hội nghị về thương mại", "D": "Thành lập tổ chức kinh tế khu vực"}, "answer": "B", "level": "Nhận biết", "page": 6, "reference": "I.1. Bối cảnh và những nét chính của cuộc chiến tranh"}, {"id": 3, "grade": 12, "lesson": 1, "question": "Theo SGK, chiến thắng bảo vệ biên giới Tây Nam góp phần tạo điều kiện gì cho nhân dân Campuchia?", "options": {"A": "Thay đổi toàn bộ đường biên giới", "B": "Chấm dứt mọi hoạt động quốc tế", "C": "Ngừng hợp tác giữa hai dân tộc", "D": "Thoát khỏi chế độ diệt chủng và hồi sinh đất nước"}, "answer": "D", "level": "Vận dụng", "page": 7, "reference": "I.2. Giá trị lịch sử"}, {"id": 4, "grade": 12, "lesson": 1, "question": "Theo SGK, cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc bùng nổ vào ngày nào?", "options": {"A": "17/2/1969", "B": "17/2/1999", "C": "17/2/1979", "D": "17/2/1989"}, "answer": "C", "level": "Nhận biết", "page": 8, "reference": "II.1. Bối cảnh và những nét chính của cuộc chiến đấu"}, {"id": 5, "grade": 12, "lesson": 1, "question": "Theo SGK, cuộc chiến đấu bảo vệ biên giới phía Bắc thể hiện điều gì?", "options": {"A": "Ý chí bảo vệ độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ", "B": "Chủ trương từ bỏ biên giới", "C": "Chỉ nhằm mục đích kinh tế", "D": "Chủ trương cô lập hoàn toàn đất nước"}, "answer": "A", "level": "Vận dụng", "page": 9, "reference": "II.2. Giá trị lịch sử"}, {"id": 6, "grade": 12, "lesson": 1, "question": "Theo SGK, quần đảo nào được nêu cùng với Hoàng Sa trong nội dung bảo vệ chủ quyền biển, đảo?", "options": {"A": "Jeju", "B": "Trường Sa", "C": "Okinawa", "D": "Hải Nam"}, "answer": "B", "level": "Nhận biết", "page": 9, "reference": "III.1. Khái lược và quá trình đấu tranh"}, {"id": 7, "grade": 12, "lesson": 1, "question": "Theo SGK, đấu tranh bảo vệ chủ quyền biển, đảo khẳng định điều gì?", "options": {"A": "Chủ quyền, quyền chủ quyền, quyền tài phán của Việt Nam trên các vùng biển, đảo", "B": "Không cần cơ sở pháp lí", "C": "Chỉ cần bảo vệ đất liền", "D": "Việt Nam không có vùng biển"}, "answer": "A", "level": "Vận dụng", "page": 10, "reference": "III.2. Giá trị lịch sử"}, {"id": 8, "grade": 12, "lesson": 1, "question": "Học sinh tham gia hoạt động tìm hiểu lịch sử bảo vệ Tổ quốc sau năm 1975 là thực hiện nội dung trách nhiệm nào?", "options": {"A": "Chia sẻ tài liệu không kiểm chứng", "B": "Không quan tâm lịch sử địa phương", "C": "Tự ý xuyên tạc sự kiện lịch sử", "D": "Chủ động tìm hiểu, nhận thức đúng và tuyên truyền về truyền thống bảo vệ Tổ quốc"}, "answer": "D", "level": "Vận dụng cao", "page": 11, "reference": "IV.1. Trách nhiệm của công dân"}, {"id": 9, "grade": 12, "lesson": 1, "question": "Theo SGK, học sinh có thể thể hiện lòng biết ơn người có công bảo vệ Tổ quốc bằng cách nào?", "options": {"A": "Phớt lờ hoạt động đền ơn đáp nghĩa", "B": "Đăng thông tin sai lệch", "C": "Từ chối tìm hiểu truyền thống", "D": "Tham gia hoạt động chăm sóc, giúp đỡ thương binh, bệnh binh và gia đình liệt sĩ"}, "answer": "D", "level": "Vận dụng cao", "page": 12, "reference": "IV.2. Trách nhiệm của học sinh"}, {"id": 10, "grade": 12, "lesson": 4, "question": "Theo SGK, chiến lược “diễn biến hòa bình” sử dụng chủ yếu biện pháp nào?", "options": {"A": "Biện pháp phi quân sự", "B": "Chỉ biện pháp y tế", "C": "Chỉ biện pháp cứu hộ", "D": "Chỉ biện pháp thể thao"}, "answer": "A", "level": "Nhận biết", "page": 31, "reference": "I.1.a. Khái niệm diễn biến hòa bình"}, {"id": 11, "grade": 12, "lesson": 4, "question": "Theo SGK, bạo loạn lật đổ là hành động chống phá bằng gì?", "options": {"A": "Hoạt động tình nguyện", "B": "Hoạt động giao lưu văn hóa", "C": "Bạo lực có tổ chức", "D": "Hoạt động học thuật"}, "answer": "C", "level": "Nhận biết", "page": 31, "reference": "I.1.b. Khái niệm bạo loạn lật đổ"}, {"id": 12, "grade": 12, "lesson": 4, "question": "Theo SGK, mối quan hệ giữa “diễn biến hòa bình” và bạo loạn lật đổ được mô tả như thế nào?", "options": {"A": "Chỉ liên quan đến thể thao", "B": "Hoàn toàn không liên quan", "C": "Là hai hoạt động giáo dục", "D": "Có quan hệ chặt chẽ với nhau"}, "answer": "D", "level": "Vận dụng", "page": 32, "reference": "I.2. Mối quan hệ"}, {"id": 13, "grade": 12, "lesson": 4, "question": "Theo SGK, thủ đoạn “diễn biến hòa bình” có thể diễn ra trên lĩnh vực nào?", "options": {"A": "Chỉ trong hoạt động du lịch", "B": "Chính trị, tư tưởng, kinh tế, văn hóa và các lĩnh vực khác", "C": "Chỉ trong hoạt động nông nghiệp", "D": "Chỉ trong hoạt động thể thao"}, "answer": "B", "level": "Nhận biết", "page": 33, "reference": "II.1.b. Thủ đoạn"}, {"id": 14, "grade": 12, "lesson": 4, "question": "Theo SGK, bạo loạn lật đổ có thể bị lợi dụng để tạo điều kiện cho mục tiêu nào?", "options": {"A": "Tổ chức hội thi học sinh", "B": "Tổ chức lễ hội truyền thống", "C": "Thực hiện mục tiêu của chiến lược “diễn biến hòa bình”", "D": "Mở rộng hoạt động thể thao"}, "answer": "C", "level": "Thông hiểu", "page": 34, "reference": "II.2. Âm mưu, thủ đoạn bạo loạn lật đổ"}, {"id": 15, "grade": 12, "lesson": 4, "question": "Giải pháp nào được SGK nêu trong phòng, chống “diễn biến hòa bình”, bạo loạn lật đổ?", "options": {"A": "Phát huy sức mạnh tổng hợp của cả hệ thống chính trị và toàn dân", "B": "Bỏ qua công tác giáo dục", "C": "Chỉ dựa vào một cá nhân", "D": "Không cần tuyên truyền"}, "answer": "A", "level": "Nhận biết", "page": 35, "reference": "III.1. Một số giải pháp phòng, chống"}, {"id": 16, "grade": 12, "lesson": 4, "question": "Một bạn định chia sẻ thông tin chưa kiểm chứng trên mạng xã hội. Theo SGK, hành động phù hợp là gì?", "options": {"A": "Thêm nội dung giật gân", "B": "Coi tin đồn là sự thật", "C": "Không đọc, xem, thích hoặc chia sẻ thông tin chưa được kiểm chứng", "D": "Chia sẻ ngay cho nhiều người"}, "answer": "C", "level": "Vận dụng", "page": 37, "reference": "III.2. Trách nhiệm của học sinh"}, {"id": 17, "grade": 12, "lesson": 5, "question": "Theo SGK, thành phần lực lượng vũ trang địa phương có lực lượng nào?", "options": {"A": "Chỉ lực lượng cứu hộ tư nhân", "B": "Bộ đội địa phương", "C": "Chỉ đội văn nghệ", "D": "Chỉ câu lạc bộ thể thao"}, "answer": "B", "level": "Nhận biết", "page": 38, "reference": "I.1. Thành phần của lực lượng vũ trang địa phương"}, {"id": 18, "grade": 12, "lesson": 5, "question": "Theo SGK, dân quân tự vệ là lực lượng vũ trang quần chúng như thế nào?", "options": {"A": "Không tham gia bảo vệ địa phương", "B": "Luôn hoạt động ở nước ngoài", "C": "Không thoát li sản xuất, công tác", "D": "Chỉ làm nhiệm vụ thương mại"}, "answer": "C", "level": "Nhận biết", "page": 39, "reference": "I.1. Thành phần của lực lượng vũ trang địa phương"}, {"id": 19, "grade": 12, "lesson": 5, "question": "Theo SGK, lực lượng dự bị động viên bao gồm những thành phần nào?", "options": {"A": "Quân nhân dự bị và phương tiện kĩ thuật dự bị", "B": "Chỉ cán bộ văn phòng", "C": "Chỉ nhân viên doanh nghiệp", "D": "Chỉ học sinh và giáo viên"}, "answer": "A", "level": "Nhận biết", "page": 39, "reference": "I.1. Thành phần của lực lượng vũ trang địa phương"}, {"id": 20, "grade": 12, "lesson": 5, "question": "Truyền thống “độc lập tự chủ, tự lực, tự cường” được SGK gắn với phẩm chất nào?", "options": {"A": "Từ bỏ nhiệm vụ bảo vệ địa phương", "B": "Ỷ lại hoàn toàn vào bên ngoài", "C": "Kiên cường, dũng cảm, mưu trí, sáng tạo trong chiến đấu và lao động", "D": "Không tham gia xây dựng địa phương"}, "answer": "C", "level": "Thông hiểu", "page": 40, "reference": "I.2. Một số nét chính về truyền thống"}, {"id": 21, "grade": 12, "lesson": 5, "question": "Theo SGK, lực lượng vũ trang địa phương có mối quan hệ với nhân dân như thế nào?", "options": {"A": "Gắn bó mật thiết, giúp đỡ lẫn nhau", "B": "Không có trách nhiệm với địa phương", "C": "Chỉ liên hệ trong thời bình", "D": "Tách biệt hoàn toàn với nhân dân"}, "answer": "A", "level": "Thông hiểu", "page": 41, "reference": "I.2. Một số nét chính về truyền thống"}, {"id": 22, "grade": 12, "lesson": 5, "question": "Theo SGK, nghệ thuật quân sự của lực lượng vũ trang địa phương có tư tưởng chiến lược nào?", "options": {"A": "Tiến công, bám trụ kiên cường; tích cực, chủ động đánh địch rộng khắp, mọi nơi, mọi lúc", "B": "Chỉ phòng thủ thụ động", "C": "Không phối hợp các lực lượng", "D": "Chỉ rút lui trong mọi tình huống"}, "answer": "A", "level": "Nhận biết", "page": 43, "reference": "I.3.b. Quán triệt tư tưởng chiến lược"}, {"id": 23, "grade": 12, "lesson": 5, "question": "Theo SGK, lực lượng vũ trang địa phương phối hợp với lực lượng nào trong chiến đấu?", "options": {"A": "Chỉ các tổ chức thương mại", "B": "Chỉ đoàn khách du lịch", "C": "Chỉ nhóm học tập", "D": "Bộ đội chủ lực trên địa bàn"}, "answer": "D", "level": "Thông hiểu", "page": 44, "reference": "I.3.e. Phối hợp, hiệp đồng"}, {"id": 24, "grade": 12, "lesson": 5, "question": "Theo SGK, học sinh có thể góp phần phát huy truyền thống lực lượng vũ trang địa phương bằng việc nào?", "options": {"A": "Tích cực học tập, tìm hiểu lịch sử, truyền thống của địa phương", "B": "Không tham gia hoạt động tìm hiểu", "C": "Chia sẻ thông tin xuyên tạc", "D": "Phủ nhận các di tích lịch sử"}, "answer": "A", "level": "Vận dụng", "page": 45, "reference": "II.2. Trách nhiệm của học sinh"}, {"id": 25, "grade": 12, "lesson": 1, "question": "Theo SGK, lực lượng nào tiến hành xâm phạm biên giới Tây Nam Việt Nam sau tháng 4/1975?", "options": {"A": "Quân đội Nhật Bản", "B": "Tập đoàn Pol Pot – Ieng Sary", "C": "Quân đội Mỹ", "D": "Quân đội Pháp"}, "answer": "B", "level": "Thông hiểu", "page": 5, "reference": "I.1. Biên giới Tây Nam"}, {"id": 26, "grade": 12, "lesson": 1, "question": "Theo SGK, quân tình nguyện Việt Nam phối hợp với lực lượng nào trong cuộc chiến đấu chống chế độ diệt chủng?", "options": {"A": "Lực lượng cách mạng Campuchia", "B": "Lực lượng quân sự của Nhật", "C": "Lực lượng quân sự của Mỹ", "D": "Lực lượng quân sự của Pháp"}, "answer": "A", "level": "Thông hiểu", "page": 6, "reference": "I.1. Biên giới Tây Nam"}, {"id": 27, "grade": 12, "lesson": 1, "question": "Chiến thắng bảo vệ biên giới Tây Nam có ý nghĩa nào đối với nhân dân Campuchia?", "options": {"A": "Thành lập một liên minh kinh tế", "B": "Xóa bỏ mọi biên giới quốc gia", "C": "Góp phần giúp nhân dân Campuchia thoát khỏi chế độ diệt chủng", "D": "Làm chấm dứt mọi tranh chấp trên thế giới"}, "answer": "C", "level": "Thông hiểu", "page": 7, "reference": "I.2. Giá trị lịch sử"}, {"id": 28, "grade": 12, "lesson": 1, "question": "Theo SGK, cuộc chiến đấu bảo vệ biên giới phía Bắc diễn ra từ ngày nào?", "options": {"A": "17/02/1979", "B": "17/02/1999", "C": "17/02/1969", "D": "17/02/1989"}, "answer": "A", "level": "Thông hiểu", "page": 8, "reference": "II.1. Biên giới phía Bắc"}, {"id": 29, "grade": 12, "lesson": 1, "question": "Theo SGK, ngày 05/03/1979, cơ quan nào ra lệnh tổng động viên?", "options": {"A": "Bộ Giáo dục và Đào tạo", "B": "Ủy ban Thường vụ Quốc hội", "C": "Hội đồng nhân dân cấp xã", "D": "Đoàn Thanh niên"}, "answer": "B", "level": "Thông hiểu", "page": 8, "reference": "II.1. Biên giới phía Bắc"}, {"id": 30, "grade": 12, "lesson": 1, "question": "Theo SGK, thắng lợi bảo vệ biên giới phía Bắc thể hiện điều gì?", "options": {"A": "Chủ trương không bảo vệ lãnh thổ", "B": "Chủ trương từ bỏ biên giới", "C": "Chỉ coi trọng kinh tế", "D": "Ý chí quyết tâm bảo vệ độc lập, chủ quyền và toàn vẹn lãnh thổ"}, "answer": "D", "level": "Thông hiểu", "page": 9, "reference": "II.2. Giá trị lịch sử"}, {"id": 31, "grade": 12, "lesson": 1, "question": "Theo SGK, hai q ion": "Trong lĩnh vực tư tưởng, SGK nêu thủ đoạn nào?", "options": {"A": "Tổ chức thể thao học đường", "B": "Xuyên tạc, phủ nhận bản chất cách mạng và khoa học của chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh", "C": "Khuyến khích học tập đúng quy định", "D": "Bảo vệ di sản văn hóa"}, "answer": "B", "level": "Thông hiểu", "page": 33, "reference": "II.1. Thủ đoạn"}, {"id": 42, "grade": 12, "lesson": 4, "question": "Trong lĩnh vực kinh tế, SGK đề cập thủ đoạn nào?", "options": {"A": "Tổ chức hoạt động thể thao", "B": "Lợi dụng hoạt động đầu tư, liên doanh, liên kết để chống phá", "C": "Tăng cường học tập pháp luật", "D": "Tham gia tình nguyện"}, "answer": "B", "level": "Thông hiểu", "page": 33, "reference": "II.1. Thủ đoạn"}, {"id": 43, "grade": 12, "lesson": 4, "question": "Theo SGK, biện pháp phòng chống nào cần được chú trọng trong nhà trường?", "options": {"A": "Chú trọng tuyên truyền, giáo dục quan điểm, đường lối, chủ trương, chính sách và pháp luật", "B": "Không cần tìm hiểu pháp luật", "C": "Từ chối mọi hoạt động giáo dục", "D": "Chia sẻ tin chưa kiểm chứng"}, "answer": "A", "level": "Vận dụng", "page": 35, "reference": "III.1. Giải pháp phòng chống"}, {"id": 44, "grade": 12, "lesson": 4, "question": "Khi thấy thông tin xuyên tạc trên mạng, học sinh nên làm gì theo SGK?", "options": {"A": "Không đọc, xem, thích, chia sẻ thông tin chưa được kiểm chứng", "B": "Tự viết thêm thông tin", "C": "Chia sẻ ngay để gây chú ý", "D": "Rủ bạn bè cùng lan truyền"}, "answer": "A", "level": "Vận dụng", "page": 36, "reference": "III.2. Trách nhiệm học sinh"}, {"id": 45, "grade": 12, "lesson": 4, "question": "Một tài khoản mạng xã hội đăng tin kích động, chưa được kiểm chứng và rủ chia sẻ. Học sinh nên làm gì?", "options": {"A": "Tự bổ sung thông tin không rõ nguồn", "B": "Chia sẻ để tăng tương tác", "C": "Rủ thêm người cùng phát tán", "D": "Không chia sẻ và chủ động kiểm chứng thông tin"}, "answer": "D", "level": "Vận dụng cao", "page": 37, "reference": "Vận dụng"}, {"id": 46, "grade": 12, "lesson": 5, "question": "Theo SGK, bộ đội địa phương thuộc lực lượng nào?", "options": {"A": "Là thành phần của Quân đội nhân dân Việt Nam", "B": "Là tổ chức kinh doanh", "C": "Là đơn vị trường học", "D": "Là câu lạc bộ thể thao"}, "answer": "A", "level": "Thông hiểu", "page": 38, "reference": "I.1. Thành phần"}, {"id": 47, "grade": 12, "lesson": 5, "question": "Theo SGK, công an cấp tỉnh và cấp xã có nhiệm vụ nào?", "options": {"A": "Bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội ở địa phương", "B": "Chỉ tổ chức thi đấu thể thao", "C": "Chỉ điều hành doanh nghiệp", "D": "Chỉ tổ chức hoạt động văn nghệ"}, "answer": "A", "level": "Thông hiểu", "page": 39, "reference": "I.1. Thành phần"}, {"id": 48, "grade": 12, "lesson": 5, "question": "Theo SGK, lực lượng vũ trang địa phương có truyền thống đoàn kết với ai?", "options": {"A": "Nhân dân và các lực lượng vũ trang địa phương bạn", "B": "Chỉ các câu lạc bộ", "C": "Chỉ các doanh nghiệp", "D": "Chỉ các tổ chức nước ngoài"}, "answer": "A", "level": "Thông hiểu", "page": 42, "reference": "I.2. Truyền thống"}, {"id": 49, "grade": 12, "lesson": 5, "question": "Theo SGK, lực lượng vũ trang địa phương vận dụng nghệ thuật đánh địch nào?", "options": {"A": "Không xây dựng thế trận", "B": "Chỉ tác chiến ở nơi không quen thuộc", "C": "Tận dụng, cải tạo địa hình, tạo lập thế trận tại chỗ", "D": "Không sử dụng địa hình"}, "answer": "C", "level": "Thông hiểu", "page": 43, "reference": "I.3. Nghệ thuật quân sự"}, {"id": 50, "grade": 12, "lesson": 5, "question": "Trong hoạt động tìm hiểu truyền thống địa phương, học sinh muốn minh họa sự phối hợp các lực lượng. Nội dung nào đúng với SGK?", "options": {"A": "Không cần phối hợp giữa các lực lượng", "B": "Mọi lực lượng hoạt động tách rời", "C": "Chỉ dựa vào một lực lượng", "D": "Phối hợp, hiệp đồng chiến đấu, phục vụ và bảo đảm chiến đấu"}, "answer": "D", "level": "Vận dụng cao", "page": 44, "reference": "I.3. Nghệ thuật quân sự"}];const STORE='gdqpan_12_wrong';let pool=[],idx=0,answers={},exam=false,deadline=0,timer=null;const $=id=>document.getElementById(id);const wrong=()=>JSON.parse(localStorage.getItem(STORE)||'[]');const saveWrong=a=>localStorage.setItem(STORE,JSON.stringify(a));function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(isExam,custom){clearInterval(timer);exam=isExam;let lesson=$('lesson').value;let arr=custom||DATA.filter(q=>lesson==='all'||String(q.lesson)===lesson);pool=shuffle(arr).slice(0,Number($('size').value));idx=0;answers={};if(!pool.length){$('quiz').textContent='Không có câu hỏi phù hợp';return}deadline=Date.now()+20*60*1000;if(exam)timer=setInterval(()=>{let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('status').textContent='Thời gian còn: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)finish()},1000);render()}function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?750:230;o.connect(g);g.connect(a.destination);g.gain.value=.04;o.start();o.stop(a.currentTime+.12)}catch(e){}}function render(){if(idx>=pool.length)return finish();let q=pool[idx],v=answers[q.id];$('status').textContent=(exam?'Thi thử':'Luyện tập')+' – Câu '+(idx+1)+'/'+pool.length;$('quiz').innerHTML='<h3>Câu '+(idx+1)+'. '+escapeHtml(q.question)+'</h3><p class="muted">Bài '+q.lesson+' · '+escapeHtml(q.level)+'</p>'+Object.entries(q.options).map(([k,t])=>'<button class="opt '+(!exam&&v&&k===q.answer?'good':!exam&&v===k&&v!==q.answer?'bad':'')+'" data-key="'+k+'" onclick="choose(this.dataset.key)" '+(!exam&&v?'disabled':'')+'>'+k+'. '+escapeHtml(t)+'</button>').join('')+(!exam&&v?'<p><b>'+(v===q.answer?'Chính xác':'Đáp án đúng: '+q.answer)+'</b></p>':'')+'<div class="toolbar"><button onclick="next()">'+(idx===pool.length-1?'Nộp bài':'Câu tiếp theo')+'</button><button onclick="finish()">Kết thúc</button></div>'}function choose(k){let q=pool[idx];if(!exam&&answers[q.id])return;answers[q.id]=k;if(!exam)sound(k===q.answer);render()}function next(){idx++;render()}function finish(){clearInterval(timer);let correct=0,bad=0,blank=0,w=new Set(wrong());pool.forEach(q=>{let a=answers[q.id];if(!a)blank++;else if(a===q.answer){correct++;w.delete(q.id)}else{bad++;w.add(q.id)}});saveWrong([...w]);$('status').textContent='Đã hoàn thành';$('quiz').innerHTML='<h3>Kết quả</h3><p>Đúng: '+correct+' · Sai: '+bad+' · Chưa làm: '+blank+'</p><p>Điểm: '+(10*correct/pool.length).toFixed(2)+'/10</p><button onclick="start(false)">Làm lượt khác</button>'}function retryWrong(){let ids=new Set(wrong());let a=DATA.filter(q=>ids.has(q.id));if(!a.length){$('quiz').textContent='Chưa có câu sai được lưu.';return}start(false,a)}function showStats(){$('quiz').textContent='Tổng câu hiện có: '+DATA.length+'; số câu sai đã lưu: '+wrong().length+'. Dữ liệu lưu trên trình duyệt này.'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}for(let x of [...new Set(DATA.map(q=>q.lesson))])$('lesson').insertAdjacentHTML('beforeend','<option value="'+x+'">Bài '+x+'</option>');$('status').textContent='Dữ liệu chỉ gồm các câu đã biên soạn, đủ 50 câu, đang chờ phản biện cuối.';</script></body></html>
